llm:
  provider: ollama
  model: gemma3:4b

embedding:
  model: BAAI/bge-small-en-v1.5

vector_store:
  collection_name: offline_rag
  persist_directory: vector_store/chroma_db

retrieval:
  top_k: 5

chunking:
  chunk_size: 512
  chunk_overlap: 50

paths:
  raw_data: data/raw
  processed_data: data/processed
  vector_store: vector_store